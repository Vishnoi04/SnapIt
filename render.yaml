services:
  - type: web
    name: snapit-api
    runtime: docker
    rootDir: .
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SNAPIT_JWT_SECRET
        generateValue: true
      - key: SNAPIT_CORS_ALLOWED_ORIGINS
        sync: false
