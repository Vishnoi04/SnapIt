spring.application.name=snapit
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:snapitDB}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

snapit.jwt.secret=${SNAPIT_JWT_SECRET}
snapit.jwt.expiration-ms=86400000
snapit.cors.allowed-origins=${SNAPIT_CORS_ALLOWED_ORIGINS:http://localhost:5173}
